{% extends "auctions/layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block body %}

    <h2>Login</h2>

    {% if message %}
        <div>{{ message }}</div>
    {% endif %}
    <form action="{% url 'login' %}" method="post">
        <div class="login-form">
            {% csrf_token %}
            <div class="login-form-item textform">
                <input autofocus class="form-control" type="text" name="username" placeholder="Username" autocomplete="off">
            </div>
            <div class="login-form-item textform">
                <input class="form-control" type="password" name="password" placeholder="Password" autocomplete="off">
            </div>
            <div class="login-form-item">
                <input type="submit" value="Login">
            </div>
            <div class="login-form-item">
                <span>Don't have an account?</span>
                <a href="{% url 'register' %}">Register here.</a>
            </div>
        </div>
    </form>


{% endblock %}
