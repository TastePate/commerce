{% extends "auctions/layout.html" %}


{% block body %}
    <h2>Create Listing</h2>

    <form action="{% url 'create' %}" method="post">
        {% csrf_token %}
        <div class="create-form">
            <div class="create-form-item">
                <label for="{{ form.title.id_for_label }}">Title <span class="mandatory">*</span></label>
                {{ form.title }}
            </div>
            <div class="create-form-item">
                <label for="{{ form.description.id_for_label }}">Description <span class="mandatory">*</span></label>
                {{ form.description }}
            </div>
            <div class="create-form-item">
                <label for="{{ form.category.id_for_label }}">Category</label>
                {{ form.category }}
            </div>
            <div class="create-form-item">
                <label for="{{ form.image_src.id_for_label }}">Image Source Link</label>
                {{ form.image_src }}
            </div>
            <div class="create-form-item">
                <label for="{{ form.start_amount.id_for_label }}">Start Amount <span class="mandatory">*</span></label>
                {{ form.start_amount }}
            </div>
            <div class="create-form-item submit">
                <input type="submit">
            </div>
        </div>

    </form>
{% endblock %}
