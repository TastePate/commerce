{% extends "auctions/layout.html" %}

{% block title %}
    Categories
{% endblock %}

{% block body %}
    <h2>Categories</h2>
    <div class="categories-container">
        {% for category in categories %}
            <a href="{% url 'category' category %}">{{ category }}</a>
        {% empty %}
            <p>There're no categories</p>
        {% endfor %}
    </div>
{% endblock %}
